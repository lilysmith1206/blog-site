services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
    volumes:
      - keycloak_postgres:/var/lib/postgresql/data
  keycloak:
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file: .env
    environment:
      KC_HOSTNAME: http://localhost:7080
      KC_DB_URL_HOST: postgres
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      - postgres
    ports:
      - "7080:7080"
      - "9000:9000"

volumes:
  keycloak_postgres:

networks:
  default:
    external: true
    name: lylink_network