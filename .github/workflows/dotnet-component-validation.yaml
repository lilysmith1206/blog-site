# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      id: dotnetbuild
      run: dotnet build --no-restore
    - uses: actions/checkout@v4
    - name: Build all Lylink service docker images via the compose.
      if: steps.dotnetbuild.outcome == 'success'
      run: docker compose -f ./docker-compose.yml -f ./private/Lylink.Keycloak/docker-compose.yml -f ./private/Lylink.Dashboard/docker-compose.yml build
