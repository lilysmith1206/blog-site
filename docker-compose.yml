services:
  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MariaDB__Root__Password} 
      MARIADB_DATABASE: lylinkdb
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  migration:
    build:
      context: .
      dockerfile: private/LylinkDatabase.MigrationScripts/Dockerfile
    command: ["server=mariadb;port=3306;database=lylinkdb;user=root;password=${MariaDB__ROOT__PASSWORD}"]
    depends_on:
      mariadb:
        condition: service_healthy
    profiles:
      - migrate

  email-worker:
    build:
      context: .
      dockerfile: protected/Workers/Lylink.Workers.Email/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Email__APIKey=${EmailProvider_ApiKey}
      - ConnectionStrings__MariaDbConnection=server=mariadb;port=3306;database=lylinkdb;user=root;password=${MariaDB__Root__Password}

  assets-api:
    build:
      context: .
      dockerfile: protected/Assets/Lylink.Assets.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "9089:8080"

  analytics-api:
    build:
      context: .
      dockerfile: protected/Analytics/Lylink.Analytics.Api/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MariaDbConnection=server=mariadb;port=3306;database=lylinkdb;user=root;password=${MariaDB__Root__Password}
    ports:
      - "9090:8080"
    labels:
      kuma.lylink.group.name: "Lylink"
      kuma.analytics-api.http.name: "Analytics API"
      kuma.analytics-api.http.url: "http://analytics-api:8080/health"
      kuma.analytics-api.http.parent_name: "lylink"

  blog-api:
    build:
      context: .
      dockerfile: protected/Blog/Lylink.Blog.Api/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MariaDbConnection=server=mariadb;port=3306;database=lylinkdb;user=root;password=${MariaDB__Root__Password}
    ports:
      - "9091:8080"
    labels:
      kuma.blog-api.http.name: "Blog API"
      kuma.blog-api.http.url: "http://blog-api:8080/health"
      kuma.blog-api.http.parent_name: "lylink"

  management-api:
    build:
      context: .
      dockerfile: protected/Management/Lylink.Management.Api/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MariaDbConnection=server=mariadb;port=3306;database=lylinkdb;user=root;password=${MariaDB__Root__Password}
    ports:
      - "9092:8080"
    labels:
      kuma.management-api.http.name: "Management API"
      kuma.management-api.http.url: "http://management-api:8080/health"
      kuma.management-api.http.parent_name: "lylink"

  blog-site:
    build:
      context: .
      dockerfile: public/Lylink.Site.Blog/Lylink.Site.Blog/Dockerfile
    depends_on:
      blog-api:
        condition: service_healthy
      analytics-api:
        condition: service_healthy
      assets-api:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AnalyticsApiClient__ClientSecret=${BlogSite__ClientSecret}
    ports:
      - "10000:8080"
    labels:
      kuma.blog-site.http.name: "Blog Site"
      kuma.blog-site.http.url: "http://blog-site:8080/api/health"
      kuma.blog-site.http.parent_name: "lylink"

  management-site:
    build:
      context: .
      dockerfile: public/Lylink.Site.Management/Dockerfile
    depends_on:
      management-api:
        condition: service_healthy
      assets-api:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - InboundAuthentication__OpenIdConnect__ClientSecret=${ManagementSite__ClientSecret}
      - ManagementApiClient__ClientSecret=${ManagementSite__ClientSecret}
    ports:
      - "10001:8080"
    labels:
      kuma.management-site.http.name: "Management Site"
      kuma.management-site.http.url: "http://management-site:8080/health"
      kuma.management-site.http.parent_name: "lylink"

volumes:
  mariadb_data:

networks:
  default:
    external: true
    name: lylink_network