services:
  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MariaDB__Root__Password} 
      MARIADB_DATABASE: lylinkdb
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  migration:
    build:
      context: .
      dockerfile: private/LylinkDatabase.MigrationScripts/Dockerfile
    command: ["server=mariadb;port=3306;database=lylinkdb;user=root;password=${MariaDB__ROOT__PASSWORD}"]
    depends_on:
      mariadb:
        condition: service_healthy
    profiles:
      - migrate

  email-worker:
    build:
      context: .
      dockerfile: protected/Workers/Lylink.Workers.Email/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Email__APIKey=${EmailProvider_ApiKey}
      - ConnectionStrings__MariaDbConnection=server=mariadb;port=3306;database=lylinkdb;user=root;password=${MariaDB__Root__Password}

  assets-api:
    build:
      context: .
      dockerfile: protected/Assets/Lylink.Assets.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "9089:8080"

  analytics-api:
    build:
      context: .
      dockerfile: protected/Analytics/Lylink.Analytics.Api/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MariaDbConnection=server=mariadb;port=3306;database=lylinkdb;user=root;password=${MariaDB__Root__Password}
    ports:
      - "9090:8080"

  blog-api:
    build:
      context: .
      dockerfile: protected/Blog/Lylink.Blog.Api/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MariaDbConnection=server=mariadb;port=3306;database=lylinkdb;user=root;password=${MariaDB__Root__Password}
    ports:
      - "9091:8080"

  management-api:
    build:
      context: .
      dockerfile: protected/Management/Lylink.Management.Api/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MariaDbConnection=server=mariadb;port=3306;database=lylinkdb;user=root;password=${MariaDB__Root__Password}
    ports:
      - "9092:8080"

  blog-site:
    build:
      context: .
      dockerfile: public/Lylink.Site.Blog/Lylink.Site.Blog/Dockerfile
    depends_on:
      - blog-api
      - analytics-api
      - assets-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "10000:8080"

  management-site:
    build:
      context: .
      dockerfile: public/Lylink.Site.Management/Dockerfile
    depends_on:
      - management-api
      - assets-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "10001:8080"

volumes:
  mariadb_data: